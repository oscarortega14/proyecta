org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true
selah.version=2.4.0

# --- Microsoft Store (MSIX) ---
# Estos tres datos salen de Partner Center → la app → "Product identity" (deben ser exactos).
# Mientras no estén, el paquete se arma con valores de prueba (sirve para probarlo, no para subirlo).
msix.identityName=PENDIENTE.Selah
msix.publisher=CN=PENDIENTE
msix.publisherDisplayName=PENDIENTE
msix.displayName=Selah

# Los objetivos de iPhone solo se compilan en una Mac: en Linux/Windows se saltan sin aviso.
kotlin.native.ignoreDisabledTargets=true
