# Proyecto de Xcode para Proyecta Remoto en iPhone/iPad.
# Se genera con XcodeGen (brew install xcodegen):   cd iosApp && xcodegen
# Luego abrir ProyectaRemoto.xcodeproj. Ver docs/IOS.md.
name: ProyectaRemoto
options:
  bundleIdPrefix: app.proyecta
  deploymentTarget:
    iOS: "15.0"
  developmentLanguage: es
settings:
  base:
    # Misma versión que el PC y Android (gradle.properties → proyecta.version)
    MARKETING_VERSION: "2.4.0"
    CURRENT_PROJECT_VERSION: "20400"
    # Escribe aquí tu Team ID de Apple (developer.apple.com → Membership), o elígelo en Xcode
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  ProyectaRemoto:
    type: application
    platform: iOS
    sources:
      - ProyectaRemoto
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.proyecta.remote
        PRODUCT_NAME: ProyectaRemoto
        TARGETED_DEVICE_FAMILY: "1,2" # iPhone y iPad
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # El framework de Kotlin lo deja aquí la tarea embedAndSignAppleFrameworkForXcode
        FRAMEWORK_SEARCH_PATHS: ["$(inherited)", "$(SRCROOT)/../remoteUi/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"]
        OTHER_LDFLAGS: ["$(inherited)", "-framework", "ProyectaRemotoUI"]
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ENABLE_BITCODE: NO
    info:
      path: ProyectaRemoto/Info.plist
      properties:
        CFBundleDisplayName: Proyecta Remoto
        CFBundleDevelopmentRegion: es
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIUserInterfaceStyle: Dark
        # Compose Multiplatform: animaciones a 120 Hz en iPhone Pro
        CADisableMinimumFrameDurationOnPhone: true
        # iOS pide permiso para hablar con equipos de la red local (el PC con Proyecta)
        NSLocalNetworkUsageDescription: "Proyecta Remoto se conecta al computador de la iglesia que proyecta las canciones y la Biblia, dentro de la misma red Wi-Fi."
        # La conexión con el PC es ws:// / http:// dentro de la red local (no sale a internet)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Sin cifrado propio (solo HTTPS del sistema): evita la pregunta de exportación en cada envío
        ITSAppUsesNonExemptEncryption: false
        # proyecta://connect?host=…
        CFBundleURLTypes:
          - CFBundleURLName: app.proyecta.remote
            CFBundleURLSchemes: [proyecta]
    preBuildScripts:
      - name: Compilar Kotlin (remoteUi)
        basedOnDependencyAnalysis: false
        script: |
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            echo "Saltando Gradle (vista previa de Xcode)"; exit 0
          fi
          cd "$SRCROOT/.."
          ./gradlew :remoteUi:embedAndSignAppleFrameworkForXcode
